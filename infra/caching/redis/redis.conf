# Redis configurado como cache (não como banco de dados)

bind 0.0.0.0
port 6379

# sem persistência: ao reiniciar, o cache volta vazio
save ""
appendonly no

# limite de memória e política de despejo (eviction)
# allkeys-lru: ao atingir o limite, remove as chaves menos usadas recentemente
maxmemory 64mb
maxmemory-policy allkeys-lru
